<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>결록 v6 · Ep0 글 전용 목업</title>
<style>
/* 글꼴: 로컬 파일이 있으면 Pretendard, 없으면 시스템 고딕. 그림 파일은 없다. */
@font-face{font-family:'Pretendard';font-weight:400;src:url('../fonts/Pretendard-Regular.woff2') format('woff2');}
@font-face{font-family:'Pretendard';font-weight:500;src:url('../fonts/Pretendard-Medium.woff2') format('woff2');}
@font-face{font-family:'Pretendard';font-weight:600;src:url('../fonts/Pretendard-SemiBold.woff2') format('woff2');}

:root{
  /* 라이트 = 한지 */
  --bg:#f3ecd9; --surface:#fbf6e8; --surface-2:#ece3cb; --line:#c4b58f;
  --text:#25211e; --muted:#5b5144; --accent:#1c6462; --accent-soft:#d6e7e0;
  --gold:#7a560a; --gold-line:#b8891f; --gold-bg:#f6e6b4;
  --alert:#a3402c; --alert-bg:#f4ddd3; --seal:#a04540; --backdrop:#d9d0b8; --scrim:rgba(37,33,30,.45);
  --f-ui:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --f-read:'Nanum Myeongjo','Noto Serif KR','AppleMyungjo','Batang',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f141c; --surface:#182130; --surface-2:#243046; --line:#34445e;
    --text:#dde3e7; --muted:#9fb0c0; --accent:#86c4bd; --accent-soft:#1c3a3b;
    --gold:#e6c36a; --gold-line:#b8923a; --gold-bg:#2f2913;
    --alert:#e39a8a; --alert-bg:#3a2420; --seal:#d9746d; --backdrop:#07090d; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#182130; --surface-2:#243046; --line:#34445e;
  --text:#dde3e7; --muted:#9fb0c0; --accent:#86c4bd; --accent-soft:#1c3a3b;
  --gold:#e6c36a; --gold-line:#b8923a; --gold-bg:#2f2913;
  --alert:#e39a8a; --alert-bg:#3a2420; --seal:#d9746d; --backdrop:#07090d; --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{word-break:keep-all;overflow-wrap:anywhere;background:var(--backdrop);color:var(--text);font-family:var(--f-ui);font-size:17px;line-height:27px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.meta{font-size:16px;line-height:24px;color:var(--muted)}
h1{font-size:22px;line-height:30px;font-weight:600}

/* 틀 */
.frame{width:100%;max-width:480px;height:100vh;height:100dvh;max-height:932px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto}
.goal{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600;font-size:17px;width:100%}
.goal .k{color:var(--muted);font-weight:500}
.goal.done{background:var(--gold-bg);color:var(--gold);border-bottom-color:var(--gold-line)}
.goal.done .k{color:var(--gold)}
.main.sheeted{overflow:hidden}
.main{overflow-y:auto;overflow-x:hidden;padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px;position:relative}
.bar{display:grid;grid-template-columns:1fr 2.2fr 1fr;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line)}
.bar button{min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;position:relative}
.bar .mid{background:var(--accent);color:var(--bg);border-radius:0;overflow:hidden}
:root[data-theme="dark"] .bar .mid{color:#0f141c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar .mid{color:#0f141c}}
.bar .mid[disabled]{background:var(--surface-2);color:var(--muted);cursor:default}
.bar .mid.gold{background:var(--gold-line);color:#1d1606}
.bar .dot{width:8px;height:8px;border-radius:50%;background:var(--alert);position:absolute;top:12px;right:calc(50% - 30px)}
.bar .fill{position:absolute;inset:0;background:var(--gold-line);transform-origin:left;transform:scaleX(var(--p,0));opacity:.95}
.bar .mid.hold{background:var(--surface-2);color:var(--text);touch-action:none;user-select:none;-webkit-user-select:none}
.bar .mid.hold span{position:relative;z-index:1;mix-blend-mode:normal}

/* 글 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-size:16px;line-height:22px;padding:0 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);white-space:nowrap}
.tag.fic{border-style:dashed}
.tag.ver{border-color:var(--accent);color:var(--accent)}
.tag.seal{border:2px solid var(--seal);color:var(--seal);font-weight:600;transform:rotate(-3deg)}
.head-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
.count{font-size:16px;color:var(--accent);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.ln{font-family:var(--f-read);font-size:17px;line-height:27px;margin-top:10px}
.ln.hole{border-left:3px solid var(--alert);padding-left:10px}
.ln.restored{border-left:3px solid var(--gold-line);padding-left:10px}
.hole-mark{color:var(--alert);font-weight:600;letter-spacing:.02em}
.filled{background:var(--gold-bg);color:var(--gold);font-weight:600;padding:0 4px;border-radius:4px}

/* 단서 낱말(밑줄) */
.clue{font-family:inherit;display:inline;color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px;background:var(--accent-soft);border-radius:3px;padding:0 2px;position:relative}
.clue::before{content:"";position:absolute;left:-6px;right:-6px;top:-12px;bottom:-12px} /* 터치 영역 확장 */
.clue.got{background:none;text-decoration-style:dotted;text-decoration-thickness:2px;text-decoration-color:var(--muted);color:var(--muted)}
.clue.got::after{content:" ✓";font-size:16px;color:var(--muted)}
.srcbtn{display:inline-flex;vertical-align:baseline;align-items:center;gap:2px;font-family:var(--f-ui);font-size:16px;line-height:24px;color:var(--accent);margin-left:6px;position:relative;white-space:nowrap}
.srcbtn::before{content:"";position:absolute;left:-6px;right:-6px;top:-10px;bottom:-10px}
.srcbtn svg{width:16px;height:16px;transition:transform .15s}
.srcbtn[aria-expanded="true"] svg{transform:rotate(180deg)}

/* 밝힌 것 */
.found{margin-top:10px;padding:8px 12px;border:1px dashed var(--line);border-radius:8px;font-size:16px;line-height:24px;color:var(--muted)}
.found b{color:var(--text);font-weight:600}
.found[hidden]{display:none}
.found.has{border-style:solid;border-color:var(--gold-line);background:var(--gold-bg);color:var(--gold)}

/* 연결 칩 */
.sec-t{font-size:16px;font-weight:600;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px 8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--accent);border-radius:22px;font-size:16px;color:var(--text);background:var(--surface)}
.chip .kd{color:var(--accent);font-weight:600}
.chip.new{animation:glow 1.6s ease-out 1;box-shadow:0 0 0 3px var(--accent-soft);background:var(--accent-soft)}
.chip.seen{opacity:.55}
.chip.locked{border-style:dashed;border-color:var(--muted);color:var(--muted);flex-wrap:wrap;padding:6px 14px;line-height:22px}
.chip.locked .why{flex-basis:100%;font-size:16px}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 3px var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 관측 쪽 */
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -16px;padding:0 16px;scrollbar-width:none;flex:none}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 calc(100% - 24px);scroll-snap-align:center;display:flex;flex-direction:column;gap:12px}
.page .obs{min-height:440px}
.dots{display:flex;gap:8px;align-items:center;justify-content:center;min-height:24px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:22px;border-radius:4px}
.obs{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.obs .lab{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600;color:var(--accent)}
.obs .lab.heard{color:var(--gold)}
.obs .stage{font-size:16px;color:var(--muted);line-height:24px;margin-top:2px}
.scene{font-family:var(--f-read);color:var(--muted);padding:0 4px}

/* 원문 보기 패널 */
.panel{margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--f-ui)}
.panel dl{display:grid;grid-template-columns:56px 1fr;gap:0}
.panel dt,.panel dd{padding:10px 12px;border-top:1px solid var(--line);font-size:16px;line-height:24px}
.panel dt:first-of-type,.panel dt:first-of-type+dd{border-top:0}
.panel dt{color:var(--muted);font-weight:600}
.panel dd.zh{font-family:var(--f-read);font-size:17px;line-height:26px}
.panel .rd{display:block;color:var(--muted);font-family:var(--f-ui);font-size:16px;margin-top:2px}
.panel .url{word-break:break-all}
.panel .na{color:var(--muted)}
.panel .lock{display:flex;gap:6px;align-items:flex-start;color:var(--muted)}
.panel .lock svg{margin-top:2px}

/* 시트 */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;top:56px;z-index:6;background:var(--surface);border-top:2px solid var(--accent);border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px 0}
.slot{min-height:56px;border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:16px;line-height:22px;color:var(--muted)}
.slot.full{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--text);font-weight:600}
.slot.shake{animation:shake .5s 1;border-color:var(--alert);background:var(--alert-bg)}
.slot .x{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;margin:-8px -10px -8px 0;color:var(--muted)}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.slot-n{padding:2px 16px 0;text-align:right;font-size:16px;color:var(--muted)}
.fb{margin:8px 16px 0;border-radius:10px;padding:10px 14px;font-size:16px;line-height:24px;min-height:72px}
.fb.idle{border:1px dashed var(--line);color:var(--muted)}
.fb.no{background:var(--alert-bg);border:1px solid var(--alert);color:var(--text)}
.fb.no .ft{display:flex;gap:6px;align-items:center;color:var(--alert);font-weight:600}
.fb.yes{background:var(--gold-bg);border:2px solid var(--gold-line);color:var(--text);animation:stamp .5s ease-out 1}
.fb.yes .ft{display:flex;gap:6px;align-items:center;color:var(--gold);font-weight:600}
.fb .big{font-size:17px;font-weight:600;line-height:26px;margin-top:2px}
@keyframes stamp{0%{transform:scale(1.06);opacity:.4}100%{transform:none;opacity:1}}
.words{display:flex;gap:8px;align-items:center;padding:10px 16px 6px;overflow-x:auto;scrollbar-width:none}
.words::-webkit-scrollbar{display:none}
.words .lb{font-size:16px;color:var(--muted);white-space:nowrap}
.wchip{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:22px;font-size:16px;white-space:nowrap;background:var(--bg)}
.wchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.bag{flex:1;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:8px}
.cc{flex:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);width:100%;min-height:44px;display:block}
.cc .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cc .n{font-weight:600;font-size:17px;line-height:24px}
.cc .kd{font-size:16px;color:var(--muted);white-space:nowrap}
.cc .l{display:block;font-family:var(--f-read);font-size:16px;line-height:24px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .w{display:block;font-size:16px;line-height:24px;color:var(--muted)}
.cc.pick{border-color:var(--accent);background:var(--accent-soft)}
.cc.concl{border:2px solid var(--gold-line);background:var(--gold-bg)}
.cc.concl .n{color:var(--gold)}
.cc.dim{opacity:.45}
.cc .new{font-size:16px;font-weight:600;color:var(--gold)}

/* 역사 고정 */
.pinbox{text-align:center;padding:6px 4px 8px;margin-top:auto}
.cmp{list-style:none;margin-top:8px}
.cmp li{display:flex;gap:10px;align-items:center;min-height:36px;font-size:16px;color:var(--muted)}
.cmp li.ok{color:var(--text)}
.cmp li.ok svg{color:var(--gold)}
.cmp .ring{width:20px;height:20px;border:1.8px solid var(--line);border-radius:50%;flex:none}
.rate{display:flex;align-items:center;gap:12px;margin-top:14px}
.rate .tr{flex:1;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.rate .tr i{display:block;height:100%;background:var(--gold-line);width:var(--r,0%)}
.rate b{font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.msg{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:24px;color:var(--muted);padding:0 4px}
.msg b{color:var(--text)}
.seal{display:inline-block}

/* 목업 전용 선택기 */
.picker{width:100%;max-width:480px;margin:0 auto;padding:12px 16px 24px;background:var(--surface-2);font-size:16px}
.picker .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.picker button{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.picker button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
@media (min-width:700px){
  body{min-height:100vh}
  .picker{position:fixed;left:12px;top:12px;width:210px;border-radius:10px;padding:12px}
  .picker .row{flex-direction:column}
}
body.shot .picker{display:none}
</style>
</head>

<div class="frame" id="frame"></div>

<div class="picker" id="picker">
  <b>목업 전용 · 화면 고르기</b>
  <div class="row" id="screens"></div>
  <div class="row" id="themes"></div>
</div>

<script>
/* ===== 자료(목업용 표. 판정은 여기서 사실로 계산하지 않고, 짝 표만 비교한다) ===== */
const L = {
  head:{ko:'집현전 부제학(集賢殿副提學) 최만리(崔萬理) 등이 상소하기를,',zh:null,words:[['부제학','집현전의 높은 관직 가운데 하나']]},
  eonmun:{ko:'신 등이 엎디어 보옵건대, 언문(諺文)을 제작하신 것이 지극히 신묘하와 만물을 창조하시고 지혜를 운전하심이 천고에 뛰어나시오나,',zh:null,words:[['언문','우리말을 적던 글자를 낮추어 부르던 말']]},
  s_seol:{ko:'신라 설총(薛聰)의 이두(吏讀)는 비록 야비한 이언(俚言)이오나, 모두 중국에서 통행하는 글자를 빌어서 어조(語助)에 사용하였기에, 문자가 원래 서로 분리된 것이 아니므로,',zh:null,words:[['이두','한자를 빌려 우리말을 적던 법']]},

  roster:{ko:'드디어 부제학(副提學) 최만리(崔萬理)·직제학(直提學) 신석조(辛碩祖)·직전(直殿) 김문(金汶), 응교(應敎) 정창손(鄭昌孫)·부교리(副校理) 하위지(河緯之)·부수찬(副修撰) 송처검(宋處儉), 저작랑(著作郞) 조근(趙瑾)을 의금부에 내렸다가 이튿날 석방하라 명하였는데, 오직 정창손만은 파직(罷職)시키고,',zh:'遂下副提學崔萬理、直提學辛碩祖、直殿金汶、應敎鄭昌孫、副校理河緯地、副修撰宋處儉、著作郞趙瑾于義禁府。 翌日, 命釋之, 唯罷昌孫職。',rd:'수하부제학최만리, 직제학신석조, 직전김문, 응교정창손, 부교리하위지, 부수찬송처검, 저작랑조근우의금부. 익일, 명석지, 유파창손직.',words:[['의금부','죄를 묻던 관청']],note:'국역 河緯之 — 원문 河緯地'},

  <div class="msg">${ic('chat')}<span><b>한 선임</b> · 고정하면 세상이 그 기록대로 굳어.</span></div>
  <p class="meta pinbox">아래 「역사 고정」을 길게 누른다.</p>`,
  bar:bar(`<i class="fill" id="fill"></i><span>${ic('pin')} 길게 눌러 역사 고정</span>`,{midCls:'hold',midAttr:`id="hold" style="--p:${p}"`,dot:false})};
}};
S['6b'] = {name:'복원된 기록', render:()=>({goal:goal(true,'완료 — 그날이 고정되었다'),
  main:`<section class="card"><div class="tags"><span class="tag">실록 · 현대어 풀이</span><span class="tag seal">고정됨</span></div>
    <h1>#C-2209 · 돌아온 그날 실록</h1>
    <p class="meta">손상 0건 · 고정률 100%</p>
    <p class="ln restored">${FIXED}${srcBtn('restored',true)}</p>
    <div class="panel"><dl>
      <dt>국역</dt><dd class="zh"><span class="tag ver" style="margin-right:6px">검증</span>「임금이 소(疏)를 보고, 만리(萬理) 등에게 이르기를, …」</dd>
      <dt>원문</dt><dd class="zh"><span class="na">확보 전 — 원문 대조 중</span></dd>
      <dt>출처</dt><dd>『세종실록』 103권, 세종 26년 2월 20일 경자<br><span class="meta url">sillok.history.go.kr/id/kda_12602020_001</span></dd></dl></div></section>
  <section aria-label="돌아온 이웃 기록"><p class="sec-t">${ic('link')} 이웃 기록이 돌아왔다</p><div class="chips">${chip('인물','임금','new')}${chip('사건','같은 손상','new')}</div></section>`,
  bar:bar('다음 ›',{midCls:'gold'})})};

/* ===== 렌더 · 선택기 ===== */
const frame = document.getElementById('frame');
let cur='1', holdTimer=null;
function show(id,opt){
  cur=id;
  const o = S[id].render(opt||{});
  frame.innerHTML = o.goal + `<main class="main ${o.main.includes('class="sheet"')?'sheeted':''}" id="main">${o.main}</main>` + o.bar;
  document.querySelectorAll('#screens button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));
  if(id==='2'){ /* 쪽 넘김 힌트: 다음 쪽 모서리가 보인다 */ }
  if(id==='5'){ const m=document.getElementById('main'); }
  bind(); history.replaceState(null,'','#'+id+location.search);
}
function bind(){
  const m = frame;
  m.querySelectorAll('[data-src]').forEach(b=>b.addEventListener('click',()=>{
    const key=b.dataset.src, open=b.getAttribute('aria-expanded')==='true';
    const holder=b.closest('.ln,.obs,.card');
    const ex=holder.querySelector(`[data-panel="${key}"]`);
    if(ex){ex.remove(); b.setAttribute('aria-expanded','false');return;}
    if(L[key]){ const t=document.createElement('div'); t.innerHTML=panel(key); b.closest('.ln').after(t.firstElementChild); b.setAttribute('aria-expanded','true'); }
  }));
  m.querySelectorAll('.clue').forEach(b=>b.addEventListener('click',()=>{ b.classList.add('got'); }));
  if(cur==='3'||cur==='4') bindSheet();
  if(cur==='6') bindHold();
  if(cur==='6b'||cur==='6'){ }
  const back = m.querySelector('[data-act="back"]'); if(back) back.addEventListener('click',()=>{});
}
function bindSheet(){
  let slots = (cur==='3'?['title','r_choi']:['title','r_jeong']);
  const redraw=(res)=>{ const o=sheetScreen(slots,res); frame.innerHTML=o.goal+`<main class="main ${o.main.includes('class="sheet"')?'sheeted':''}" id="main">${o.main}</main>`+o.bar; wire(); };
  const wire=()=>{
    frame.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>{
      const id=b.dataset.card; const i=slots.indexOf(id);
      if(i>=0) slots.splice(i,1); else if(slots.length<2) slots.push(id);
      redraw({});
    }));
    frame.querySelectorAll('.slot .x').forEach((x,i)=>x.addEventListener('click',()=>{slots.splice(i,1);redraw({});}));
    frame.querySelectorAll('.wchip').forEach(w=>w.addEventListener('click',()=>{ const on=w.getAttribute('aria-pressed')==='true'; w.setAttribute('aria-pressed',!on); }));
    const mid=frame.querySelector('.bar .mid');
    mid.addEventListener('click',()=>{
      if(slots.length<2) return;
      const hit=PAIRS.find(p=>same(p.set,slots));
      if(hit) redraw({result:'A'});
      else { const w=WHY.find(x=>same(x.set,slots)); redraw({result:'no',shake:w?w.bad:slots[1]}); }
    });
  };
  wire();
}
function bindHold(){
  const hold=document.getElementById('hold'); if(!hold) return;
  const q=new URLSearchParams(location.search);
  if(q.has('hold')) return; /* 고정된 진행 상태(촬영용) */
  let t0=0, raf=0; const D=1200;
  const upd=p=>{ hold.style.setProperty('--p',p); document.getElementById('rate-i').style.setProperty('--r',Math.round(p*100)+'%'); document.getElementById('rate-n').textContent=Math.round(p*100)+'%'; frame.querySelectorAll('.cmp li').forEach(li=>{const ok=p>=parseFloat(li.dataset.th); if(ok!==li.classList.contains('ok')){li.classList.toggle('ok',ok); li.firstElementChild.outerHTML= ok?`${ic('check')}`:'<span class="ring"></span>';}}); };
  const tick=()=>{ const p=Math.min(1,(performance.now()-t0)/D); upd(p); if(p>=1){ cancelAnimationFrame(raf); show('6b'); } else raf=requestAnimationFrame(tick); };
  const start=e=>{ e.preventDefault(); t0=performance.now(); raf=requestAnimationFrame(tick); };
  const stop=()=>{ cancelAnimationFrame(raf); upd(0); };
  hold.addEventListener('pointerdown',start);
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>hold.addEventListener(ev,stop));
  hold.addEventListener('contextmenu',e=>e.preventDefault());
}

const sc=document.getElementById('screens');
Object.keys(S).forEach((id,i)=>{ const b=document.createElement('button'); b.dataset.id=id; b.textContent=(i+1>6?'6b':i+1)+' '+S[id].name; b.setAttribute('aria-pressed','false'); b.addEventListener('click',()=>{ history.replaceState(null,'',location.pathname); show(id); }); sc.appendChild(b); });
const th=document.getElementById('themes');
[['','자동'],['light','라이트'],['dark','다크']].forEach(([v,l])=>{ const b=document.createElement('button'); b.textContent=l; b.addEventListener('click',()=>{ if(v) document.documentElement.dataset.theme=v; else delete document.documentElement.dataset.theme; }); th.appendChild(b); });

const q=new URLSearchParams(location.search);
if(q.get('theme')) document.documentElement.dataset.theme=q.get('theme');
if(q.has('shot')) document.body.classList.add('shot');
const startId=(location.hash||'#1').slice(1); const sid=S[startId]?startId:'1';
if(sid==='6'&&q.has('hold')) show('6',{p:parseFloat(q.get('hold'))||0}); else show(sid);
if(sid==='5'){ /* 2쪽 상태 */ }
</script>
