<!doctype html><html><body style="margin:0;background:#556"><canvas id="c"></canvas><script type="module">
import { TILES, SPRITES, renderSpriteToCanvas } from '/src/game/art/index.ts';
const keys=[...Object.keys(TILES)];
const sc=2;const cols=10;
const objs=Object.keys(SPRITES).filter(k=>k.startsWith('obj_')||k.startsWith('artifact_'));
const c=document.getElementById('c');c.width=cols*70*sc;c.height=(Math.ceil(keys.length/cols)*40+ Math.ceil(objs.length/6)*110+20)*sc;
const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.font='9px monospace';x.fillStyle='#fff';
keys.forEach((k,i)=>{const px=(i%cols)*70*sc,py=Math.floor(i/cols)*40*sc;x.drawImage(renderSpriteToCanvas(TILES[k],0,1),px,py,32*sc,32*sc);x.fillText(k.replace('tile_',''),px,py+36*sc>0?py+34*sc+0:0)});
const oy=Math.ceil(keys.length/cols)*40*sc+10;
objs.forEach((k,i)=>{const px=(i%6)*110*sc,py=oy+Math.floor(i/6)*110*sc;const s=SPRITES[k];x.drawImage(renderSpriteToCanvas(s,0,1),px,py,s.w*sc,s.h*sc);x.fillText(k+' '+s.w+'x'+s.h,px,py+s.h*sc+10)});
document.title='done';
</script></body></html>
